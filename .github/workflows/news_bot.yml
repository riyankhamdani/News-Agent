name: Daily News Bot Execution (Jam 5 Sore WIB)

on:
  schedule:
    - cron: '0 10 * * *'  # Jam 10:00 UTC = Jam 17:00 WIB
  workflow_dispatch:      # Tombol manual eksekusi

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyTelegramBotAPI google-genai tavily-python

      - name: Run News Bot Script (Mode Cron)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MODE: cron
        run: |
          python agent.py

      - name: Commit and Push seen_news.json
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f seen_news.json ]; then
            git add seen_news.json
            git diff --staged --quiet || (git commit -m "chore: persist seen_news state [skip ci]" && git push)
          else
            echo "ℹ️ File seen_news.json belum ada di runner, skip commit."
          fi
